# Supply a certificate trusted by ALL classroom devices; include the host/IP in its SAN.
server.address=0.0.0.0
server.ssl.enabled=true
server.ssl.key-store=${PBL4_TLS_KEYSTORE}
server.ssl.key-store-password=${PBL4_TLS_PASSWORD}
server.ssl.key-store-type=PKCS12
app.allowed-origins=${PBL4_ALLOWED_ORIGINS}
